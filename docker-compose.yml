services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pitwall
      POSTGRES_PASSWORD: pitwall
      POSTGRES_DB: pitwall
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitwall"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PITWALL_DATA_SOURCE: "fixture"      # switch to "openf1" for live data
      PITWALL_DATABASE_URL: "postgresql+asyncpg://pitwall:pitwall@db:5432/pitwall"
      PITWALL_REDIS_URL: "redis://redis:6379/0"
      PITWALL_CORS_ORIGINS: '["*"]'
    ports:
      - "8000:8000"
    volumes:
      - ./frontend:/app/frontend:ro

volumes:
  pgdata:
