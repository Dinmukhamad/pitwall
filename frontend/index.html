<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pit Wall — второй экран F1</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
<div class="app">

  <!-- ================= Шапка ================= -->
  <header>
    <div class="brand"><b>PIT WALL</b><span>второй экран</span></div>

    <div class="viewswitch" role="tablist" aria-label="Разделы">
      <button id="v-race" class="active" role="tab" aria-selected="true">Гонка</button>
      <button id="v-season" role="tab" aria-selected="false">Сезон</button>
      <button id="v-news" role="tab" aria-selected="false">Новости</button>
    </div>

    <label class="field race-only">
      <span>Гонка</span>
      <select id="session-select" aria-label="Выбор гонки"></select>
    </label>

    <div id="flag" class="flag race-only">—</div>
    <div class="lap race-only">КРУГ <b id="lap-current">–</b><span class="of"> / <span id="lap-total">–</span></span></div>

    <div class="controls race-only">
      <button id="play-btn" aria-label="Пуск/пауза">▶</button>
      <button class="spd active" data-spd="2">2×</button>
      <button class="spd" data-spd="6">6×</button>
      <button class="spd" data-spd="15">15×</button>
      <input type="range" id="scrubber" class="scrub-input" min="0" max="100" value="0" step="0.1"
             aria-label="Прогресс гонки" />
      <span class="clock" id="clock">00:00 / 00:00</span>
    </div>

    <label class="offset race-only" title="Подстройка второго экрана под задержку эфира (FR-42)">
      Offset
      <input type="number" id="offset" value="0" step="0.5" /> с
    </label>

    <div class="demo-badge" id="conn-status"><span id="conn-label">…</span></div>
  </header>

  <!-- ================= Вид «Гонка» ================= -->
  <main id="view-race">

    <section class="panel">
      <div class="phead">
        <h2>Timing Tower</h2>
        <span class="hint" id="gap-toggle" style="cursor:pointer"
              title="Переключить режим разрыва">интервал ▸ к лидеру</span>
      </div>
      <div class="tower" id="tower"></div>
    </section>

    <section class="panel">
      <div class="phead">
        <h2>Карты трассы</h2>
        <span class="hint" id="weather" style="margin-left:auto"></span>
        <span class="hint" id="maps-count" style="margin-left:0"></span>
        <button id="add-map" class="mbtn">＋ карта</button>
      </div>
      <div class="maps" id="maps-wrap"></div>
    </section>

    <section class="panel">
      <div class="phead">
        <h2>Телеметрия</h2>
        <span class="hint" id="active-driver">—</span>
      </div>
      <div class="telem" id="telemetry"></div>
    </section>

    <section class="strat">
      <div class="phead">
        <h2>Стратегия шин</h2>
        <span class="hint">S софт · M медиум · H хард</span>
      </div>
      <div class="axis"><span>ПИЛОТ</span><div class="ticks" id="ticks"></div></div>
      <div class="stratbody" id="tyres"></div>
    </section>

  </main>

  <!-- ================= Вид «Сезон» ================= -->
  <div id="view-season" class="season hidden">
    <div id="season-body"></div>
  </div>

  <!-- ================= Вид «Новости» ================= -->
  <div id="view-news" class="season hidden">
    <div id="news-body"></div>
  </div>

  <!-- Читалка: материал открывается на сайте, без перехода на сторонний ресурс -->
  <div id="reader" class="reader hidden" role="dialog" aria-modal="true" tabindex="-1">
    <article id="reader-body"></article>
  </div>

</div>

<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
