<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pit Wall — второй экран F1</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body>
  <!-- ================= Header ================= -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">PIT&nbsp;WALL</span>
    </div>

    <nav class="views" role="tablist" aria-label="Разделы">
      <button class="view-btn active" id="v-race" role="tab" aria-selected="true">Гонка</button>
      <button class="view-btn" id="v-season" role="tab" aria-selected="false">Сезон</button>
      <button class="view-btn" id="v-news" role="tab" aria-selected="false">Новости</button>
    </nav>

    <div class="session-controls">
      <label class="field">
        <span>Сессия</span>
        <select id="session-select" aria-label="Выбор гонки"></select>
      </label>
      <div class="flag-chip" id="flag-chip" data-flag="UNKNOWN">
        <span class="flag-dot"></span><span id="flag-label">—</span>
      </div>
      <div class="lap-chip">
        Круг <b id="lap-current">–</b><span>/</span><span id="lap-total">–</span>
      </div>
    </div>

    <div class="weather" id="weather" aria-label="Погода">
      <span title="Воздух">🌡 <b id="w-air">–</b>°</span>
      <span title="Трасса">🛣 <b id="w-track">–</b>°</span>
      <span title="Влажность">💧 <b id="w-hum">–</b>%</span>
      <span title="Ветер">💨 <b id="w-wind">–</b> м/с</span>
    </div>

    <div class="conn" id="conn-status" title="Состояние данных">
      <span class="conn-dot"></span><span id="conn-label">…</span>
    </div>
  </header>

  <!-- ================= Вид «Гонка» ================= -->
  <div class="view" id="view-race">
  <main class="grid">
    <!-- Timing tower -->
    <section class="panel tower-panel" aria-label="Timing Tower">
      <div class="panel-head">
        <h2>Timing Tower</h2>
        <button class="ghost-btn" id="gap-toggle" title="Переключить режим разрыва">
          Разрыв: <b id="gap-mode">интервал</b>
        </button>
      </div>
      <div class="tower-head">
        <span class="c-pos">P</span>
        <span class="c-drv">Пилот</span>
        <span class="c-gap" id="gap-col-label">Инт.</span>
        <span class="c-lap">Круг</span>
        <span class="c-ind">DRS/PIT</span>
      </div>
      <ol class="tower" id="tower"></ol>
    </section>

    <!-- Maps -->
    <section class="panel maps-panel" aria-label="Карты трассы">
      <div class="panel-head">
        <h2>Карта трассы</h2>
        <div class="maps-actions">
          <span class="hint" id="maps-count">1 / 3</span>
          <button class="ghost-btn" id="add-map">+ карта</button>
        </div>
      </div>
      <div class="maps-wrap" id="maps-wrap"></div>
    </section>

    <!-- Telemetry + tyres -->
    <section class="panel side-panel">
      <div class="panel-head">
        <h2>Телеметрия</h2>
        <span class="active-driver" id="active-driver">— выберите пилота</span>
      </div>
      <div class="telemetry" id="telemetry">
        <div class="tm-tiles">
          <div class="tile"><span class="tile-label">Скорость</span><span class="tile-val"><b id="tm-speed">–</b><i>км/ч</i></span></div>
          <div class="tile"><span class="tile-label">Передача</span><span class="tile-val"><b id="tm-gear">–</b></span></div>
          <div class="tile"><span class="tile-label">Обороты</span><span class="tile-val"><b id="tm-rpm">–</b><i>rpm</i></span></div>
          <div class="tile"><span class="tile-label">DRS</span><span class="tile-val"><b id="tm-drs">–</b></span></div>
        </div>
        <div class="bar-row"><span>Газ</span><div class="bar throttle"><i id="tm-throttle"></i></div></div>
        <div class="bar-row"><span>Тормоз</span><div class="bar brake"><i id="tm-brake"></i></div></div>
        <div class="tyre-now" id="tyre-now"></div>
        <canvas id="speed-graph" class="speed-graph" height="120"></canvas>
      </div>

      <div class="panel-head sub">
        <h2>Стратегия шин</h2>
      </div>
      <div class="tyres" id="tyres"></div>
    </section>
  </main>

  <!-- ================= Replay controls ================= -->
  <footer class="transport">
    <div class="mode-switch" role="group" aria-label="Режим">
      <button id="mode-replay" class="mode-btn active">Повтор</button>
      <button id="mode-live" class="mode-btn" title="Требует источник openf1">Live</button>
    </div>
    <button class="play-btn" id="play-btn" aria-label="Пуск/пауза">▶</button>
    <div class="speeds" role="group" aria-label="Скорость воспроизведения">
      <button class="spd" data-spd="1">1×</button>
      <button class="spd active" data-spd="2">2×</button>
      <button class="spd" data-spd="6">6×</button>
      <button class="spd" data-spd="15">15×</button>
    </div>
    <input type="range" id="scrubber" class="scrubber" min="0" max="100" value="0" step="0.1" aria-label="Прогресс гонки" />
    <span class="clock" id="clock">00:00 / 00:00</span>
    <label class="offset" title="Подстройка смещения второго экрана под задержку эфира (FR-42)">
      Offset
      <input type="number" id="offset" value="0" step="0.5" /> с
    </label>
  </footer>
  </div><!-- /view-race -->

  <!-- ================= Вид «Сезон» ================= -->
  <div class="view hidden" id="view-season">
    <div class="page" id="season-body"></div>
  </div>

  <!-- ================= Вид «Новости» ================= -->
  <div class="view hidden" id="view-news">
    <div class="page" id="news-body"></div>
  </div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
